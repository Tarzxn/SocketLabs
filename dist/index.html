</style><header><strong><span class="brand-mark" aria-hidden="true">⌬</span>Socket Labs</strong><button id="saved">Saved builds</button></header><main>
<h1>Build your PC</h1><p>Choose parts one component at a time.</p><div class="layout"><section class="panel"><h2>Components</h2>
<div class="builder-tools"><div class="build-name"><label for="name">Build name</label><input id="name" value="Untitled build" maxlength="90"></div>
<div class="actions"><button id="preset">Example build</button><button id="reset">New build</button></div></div>
<p id="notice" role="status"></p><div id="build"></div></section><aside><section class="panel"><h2>Build total</h2><div class="amount" id="total"></div><p><span id="price-note"></span></p><div class="actions"><button id="save" class="primary">Save build</button><button id="share">Copy share link</button><button id="export">Export CSV</button></div></section><section class="panel"><h2>Compatibility</h2><ul id="checks"></ul></section></aside></div><footer>Catalogue data adapted from <a href="https://github.com/iBlessi/pc-builder-parts">TechFuel HQ PC Builder Parts</a> under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Socket Labs maps the original specs to its picker and compatibility checks.</footer><div class="mobile-total">Build total <strong id="mobile-total"></strong></div></main><dialog id="modal" aria-labelledby="title"><form method="dialog"><button style="float:right">Close</button></form><h2 id="title"></h2><div id="filters" class="actions"><input id="search" placeholder="Search model or spec" aria-label="Search model or spec"><select id="sort" aria-label="Sort parts"><option value="price">Price low to high</option><option value="name">Model name</option></select><label><input type="checkbox" id="compatible"> Hide known conflicts</label></div><div id="results"></div><div class="actions" id="page"></div></dialog><script src="/catalogue.js"></script><script>
const categories=['CPU','CPU cooler','Motherboard','Memory','Storage','Graphics card','Case','Power supply'];
const rows=[
[0,'AMD Ryzen 5 7600',170,{socket:'AM5',w:65}], [0,'Intel Core i5-12400F',110,{socket:'LGA1700',w:65}],
[1,'Thermalright Peerless Assassin 120 SE',33,{sockets:['AM5','LGA1700'],height:155}], [1,'Noctua NH-D15',90,{sockets:['AM5','LGA1700'],height:165}],
[2,'MSI PRO B650M-A WIFI',139,{socket:'AM5',ram:'DDR5',form:'mATX',m2:true}], [2,'MSI PRO B660M-A DDR4',105,{socket:'LGA1700',ram:'DDR4',form:'mATX',m2:true}],
[3,'Corsair Vengeance 32 GB DDR5-6000',95,{ram:'DDR5'}],[3,'Corsair Vengeance LPX 32 GB DDR4-3200',53,{ram:'DDR4'}],
[4,'Samsung 990 PRO 2 TB',145,{m2:true}], [4,'WD Black SN770 1 TB',65,{m2:true}],
[5,'Sapphire Pulse Radeon RX 7600',240,{length:240,w:165,minPsu:550}], [5,'ASUS Dual GeForce RTX 4060 OC',275,{length:227.2,w:115,minPsu:550}],
[6,'Fractal Design Pop Mini Air',78,{forms:['mATX','Mini-ITX'],gpu:365,cooler:170,psu:'ATX'}],[6,'Fractal Design North',120,{forms:['ATX','mATX','Mini-ITX'],gpu:355,cooler:170,psu:'ATX'}],
[7,'Corsair CX450',42,{w:450,form:'ATX'}],[7,'Corsair RM650e 650 W',75,{w:650,form:'ATX'}]];
const parts=new Map([...rows.map(([category,name,price,spec],id)=>({id,category,name,price,spec})),...(globalThis.importedCatalogue??[])].map(part=>[part.id,part]));
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n);
const get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const store=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
const clean=ids=>categories.map((_,i)=>parts.get(ids?.[i])?.category===i?ids[i]:null);
let active=get('partbench-active',{}), library=get('partbench-library',[]), filter=null, page=0;
try{if(location.hash)active=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch{}
const cleanDrives = values => Array.isArray(values) ? values.slice(0,24).filter(id=>parts.get(id)?.category===4) : [];
let ids=clean(active?.ids), drives=cleanDrives(active?.drives), driveIndex=null; $('name').value=typeof active?.name==='string'?active.name:'Untitled build';
function checks(selection, extras=drives){
 const [cpu,cool,board,ram,ssd,gpu,box,psu]=selection.map(id=>parts.get(id)?.spec);
 const output=[];
 function check(a,b,x,y,test,label){
  const known=x!=null&&y!=null;
  output.push([a&&b?(known?(test(x,y)?'Pass':'Conflict'):'Unknown'):'Pending',label]);
 }
 const equals=(a,b)=>a===b, includes=(a,b)=>a.includes(b), fits=(a,b)=>a<=b;
 check(cpu,board,cpu?.socket,board?.socket,equals,'CPU and motherboard socket');
 check(cpu,cool,cool?.sockets,cpu?.socket,includes,'Cooler socket support');
 check(board,ram,board?.ram,ram?.ram,equals,'Motherboard and memory type');
 const storage=[ssd,...extras.map(id=>parts.get(id)?.spec)].filter(Boolean);
 const m2Count=storage.filter(drive=>drive.m2===true).length;
 const slots=board?.m2Slots??(board?.m2===false?0:undefined);
 check(board,storage.length,m2Count,slots??(m2Count===1&&board?.m2?1:undefined),fits,'M.2 slots');
 if(storage.some(drive=>drive.m2!==true)&&output.at(-1)[0]==='Pass')output.at(-1)[0]='Unknown';
 check(board,box,box?.forms,board?.form,includes,'Motherboard fits case');
 check(gpu,box,gpu?.length,box?.gpu,fits,'GPU length clearance');
 check(cool,box,cool?.height,box?.cooler,fits,'Cooler height clearance');
 check(box,psu,box?.psu,psu?.form,equals,'Power supply form factor');
 check(gpu,psu,gpu?.minPsu,psu?.w,fits,'GPU recommended PSU capacity');
 return output;
}
function state(){return {name:$('name').value.trim()||'Untitled build',ids:[...ids],drives:[...drives]}}
function total(selection){return selection.reduce((sum,id)=>sum+(parts.get(id)?.price??0),0)}
function node(tag,value){const element=document.createElement(tag);element.textContent=value;return element}
function button(label,action){const element=node('button',label);element.onclick=action;return element}
function render(){
 $('build').replaceChildren(); categories.forEach((category,i)=>{
 const row=node('div','');row.className='row';const part=parts.get(ids[i]),desc=node('div',part?.name??'No part selected');
 if(!part)desc.className='empty';
 if(part)desc.append(node('small',part.price===null?'Price unavailable':money(part.price)+' sample'));
 const actions=node('div','');actions.className='actions';const choose=button(part?'Change':'Choose '+category,()=>openPicker(i));
 if(!part)choose.className='primary';actions.append(choose);
 if(part)actions.append(button('Remove',()=>{ids[i]=i===4?(drives.shift()??null):null;render()}));
 row.append(node('strong',category),desc,actions);$('build').append(row);
 if(i===4&&part){
   drives.forEach((id,index)=>{
     const extra=parts.get(id), drive=node('div',''), controls=node('div','');
     drive.className='row extra-drive';controls.className='actions';
     controls.append(button('Change',()=>openPicker(4,index)),button('Remove',()=>{drives.splice(index,1);render()}));
     drive.append(node('strong','Drive '+(index+2)),node('div',extra.name),controls);
     $('build').append(drive);
   });
   if(drives.length<24){
     const more=node('div','');more.className='row extra-drive';
     more.append(node('strong','Additional storage'),node('span',''),button('Add drive',()=>openPicker(4,drives.length)));
     $('build').append(more);
   }
 }
 });
 const selected=[...ids,...drives].map(id=>parts.get(id)).filter(Boolean);
 const priced=selected.filter(part=>part.price!==null);
 const amount=priced.length?money(total([...ids,...drives])):'—';
 $('total').textContent=amount; $('mobile-total').textContent=amount;
 $('price-note').textContent=priced.length+' of '+selected.length+' selected parts have illustrative GBP prices.';
 $('checks').replaceChildren(...checks(ids).map(([status,label])=>{
   const item=node('li',''), badge=node('span',status);badge.className='status '+status.toLowerCase();item.append(node('span',label),badge);return item;
 }));
 store('partbench-active',state());
}
function openPicker(category,index=null){
 filter=category;driveIndex=index;page=0;$('title').textContent=index===null?'Choose '+categories[category]:'Choose storage drive '+(index+2);
 $('filters').style.display='flex'; $('search').value=''; list(); $('modal').showModal(); $('search').focus();
}
function list(){
 const terms=$('search').value.toLowerCase().trim().split(/\s+/);
 const matches=[...parts.values()].filter(part=>{
  if(part.category!==filter)return false;
  const searchable=[part.name,part.details,...Object.values(part.spec)].join(' ').toLowerCase();
  if(!terms.every(term=>searchable.includes(term)))return false;
  const selection=ids.map((id,i)=>i===filter&&driveIndex===null?part.id:id);
  const extras=[...drives]; if(driveIndex!==null)extras[driveIndex]=part.id;
  return !$('compatible').checked||!checks(selection,extras).some(([status],i)=>status==='Conflict'&&ruleCategories[i].includes(filter));
 });
 const byName=(a,b)=>a.name.localeCompare(b.name);
 matches.sort($('sort').value==='price'?(a,b)=>(a.price??Infinity)-(b.price??Infinity)||byName(a,b):byName);
 const pageSize=20, start=page*pageSize;
 $('results').replaceChildren(...matches.slice(start,start+pageSize).map(part=>{
   const row=node('div','');row.className='row';
   const desc=node('div','');desc.append(node('strong',part.name));
   const details=part.details||Object.values(part.spec).join(' · ');
   desc.append(node('small',[details,part.price===null?'Price unavailable':money(part.price)+' sample'].filter(Boolean).join(' · ')));
   if(typeof part.source==='string'&&part.source.startsWith('https://')){
     const source=node('a','Specifications source');source.href=part.source;source.target='_blank';source.rel='noopener noreferrer';desc.append(node('small',''));
     desc.lastChild.append(source);
   }
   const selected=(driveIndex===null?ids[filter]:drives[driveIndex])===part.id;
   const add=button(selected?'Selected':'Add',()=>{if(driveIndex===null)ids[filter]=part.id;else drives[driveIndex]=part.id;$('modal').close();render()});
   add.className='primary'; add.disabled=selected;row.append(desc,add);return row;
 }));
 $('results').scrollTop=0;
 if(!matches.length)$('results').append(node('p','No matching parts.'));
 const prev=button('Previous',()=>{page--;list()}), next=button('Next',()=>{page++;list()});
 prev.disabled=page===0;next.disabled=start+pageSize>=matches.length;
 $('page').replaceChildren(node('span',matches.length? (start+1)+'–'+Math.min(start+pageSize,matches.length)+' of '+matches.length+' parts':'0 parts'),prev,next);
}
const ruleCategories=[[0,2],[0,1],[2,3],[2,4],[2,6],[5,6],[1,6],[6,7],[5,7]];
$('search').oninput=$('sort').onchange=$('compatible').onchange=()=>{page=0;list()};
$('name').oninput=()=>store('partbench-active',state());
const notify=value=>$('notice').textContent=value;
$('preset').onclick=()=>{ids=[0,2,4,6,9,10,12,15];drives=[];$('name').value='Example gaming build';render();notify('Example build loaded.')};
$('reset').onclick=()=>{ids=clean([]);drives=[];$('name').value='Untitled build';render();notify('Started a new build.')};
$('save').onclick=()=>{const build=state();library=[build,...library.filter(item=>item.name!==build.name)];store('partbench-library',library);notify('Saved to this browser.')};
$('saved').onclick=()=>{$('title').textContent='Saved builds';$('filters').style.display='none'; $('page').replaceChildren();
 $('results').replaceChildren(...library.map(item=>button(item.name,()=>{ids=clean(item.ids);drives=cleanDrives(item.drives);$('name').value=item.name;render();$('modal').close()})));
 if(!library.length)$('results').append(node('p','No saved builds yet.'));$('modal').showModal()
};
$('share').onclick=async()=>{const url=location.href.split('#')[0]+'#'+encodeURIComponent(JSON.stringify(state()));try{await navigator.clipboard.writeText(url);notify('Share link copied.')}catch{window.prompt('Copy build link',url)}};
$('export').onclick=()=>{
 const quote=value=>'"'+String(value??'').replaceAll('"','""')+'"';
 const lines=[['Category','Part','Sample price GBP'],...[...ids,...drives].flatMap((id,i)=>{
   const part=parts.get(id);return part?[[categories[i]??'Storage',part.name,part.price]]:[];
 })].map(line=>line.map(quote).join(','));
 const url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));
 const a=document.createElement('a');a.href=url;a.download='socketlabs-build.csv';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('sort').value='name';$('compatible').checked=true;
render();
</script></html>
